name: dbt build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install dbt-duckdb==1.9.4
      # models + data tests on the versioned raw data, no cloud account needed
      - run: dbt build --profiles-dir .
      # the marts exported by the build must match the versioned ones
      - run: git diff --exit-code data/marts/
